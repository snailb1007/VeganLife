# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: android pre-release

on:
  push:
    branches: [ "develop_1.0" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.gitattributes'
  pull_request:
    branches: [ "develop_1.0" ]

jobs:
  build:
    runs-on: windows-latest # Adjusted to a Windows runner, which is suitable for .NET MAUI projects

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install Maui workload
      run: |
        dotnet workload install android --ignore-failed-sources
        dotnet workload install maui --ignore-failed-sources
    - name: Restore Dependencies
      run: dotnet restore VeganLife/VeganLife.csproj # Corrected indentation
    - name: Build Maui android
      run: dotnet build VeganLife/VeganLife.csproj -c Release -f net8.0-android34 --no-restore
